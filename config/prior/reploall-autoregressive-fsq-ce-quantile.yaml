run_name: nips-reploall-autoregressive-fsq-ce-quantile_seed420
seed: 420
work_dir: outputs/experiments-final
n_iters: 75000
learning_rate: 2.0e-4
warmup_steps: 3000
grad_clip: 1.0
log_freq: 100
eval_freq: 5000
save_freq: 5000
lr_schedule: cosine
max_val_iters: 500

dataset:
  h5ad_path: datasets/replogle/replogle_combined_scldm2k.h5ad
  ctrl_label: non-targeting
  load_lazily: false
  batch_size: 128
  num_workers: 0
  pert_mapping_path: datasets/competition_support_set/ESM2_pert_features.pt
  apply_normalize: false
  apply_log1p: false
  use_binning: quantile
  split_path: assets/scldm_replogle_test.json

model:
  type: autoregressive
  vae_path: outputs/experiments-final/nips-reploall-vae-fsq-ce-quantile_seed401
  do_celltype_cond: true
  transformer:
    type: dit
    d_model: 384
    nhead: 8
    num_layers: 6
    dim_feedforward: 1536
    causal_input_mask: true
  output_head:
    type: cross_entropy

wandb:
  enabled: true
  project: sc_evae
